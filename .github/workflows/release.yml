name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v17.3, v17.4, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g., v17.4)'
        required: true

permissions:
  contents: write  # Required for creating releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      # Tag push: the pushed tag. Manual run: the tag typed into the input.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install GNOME development tools
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          # On Ubuntu 24.04:
          # - libglib2.0-dev provides development headers
          # - libglib2.0-bin provides glib-compile-resources and glib-compile-schemas
          sudo apt-get install -y \
            libgirepository1.0-dev \
            libglib2.0-dev \
            libglib2.0-bin \
            glib-networking \
            glib-networking-bin
          # Verify installation
          which glib-compile-resources && echo "✓ glib-compile-resources found"
          which glib-compile-schemas && echo "✓ glib-compile-schemas found"

      - name: Install dependencies
        run: npm ci

      - name: Debug glib tools
        run: |
          echo "PATH=$PATH"
          echo "--- runner image"
          cat /etc/os-release | head -3
          echo "--- package status"
          dpkg -l libglib2.0-dev-bin libglib2.0-bin 2>&1 | tail -n 3 || true
          echo "--- files provided by libglib2.0-dev-bin"
          dpkg -L libglib2.0-dev-bin 2>&1 | grep 'bin/' || true
          echo "--- tools on disk"
          ls -l /usr/bin/glib-compile-* 2>&1 || true
          echo "--- resolved by shell"
          command -v glib-compile-resources || echo "glib-compile-resources NOT FOUND"
          command -v glib-compile-schemas || echo "glib-compile-schemas NOT FOUND"

      # `npm run build` cleans, bundles, compiles schemas and resources, and
      # generates both dist/ (GNOME 45+) and dist_legacy/ (GNOME 42-44)
      - name: Build
        run: npm run build

      - name: Package
        run: |
          test -f dist/resources.gresource
          test -f dist_legacy/resources.gresource
          (cd dist && zip -qr ../tilingshell-main.zip .)
          (cd dist_legacy && zip -qr ../tilingshell-legacy.zip .)

      - name: Upload main package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilingshell-main
          path: tilingshell-main.zip
          retention-days: 7

      - name: Upload legacy package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilingshell-legacy
          path: tilingshell-legacy.zip
          retention-days: 7

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            tilingshell-main.zip
            tilingshell-legacy.zip